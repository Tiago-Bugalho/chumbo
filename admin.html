<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 flex items-center justify-center min-h-screen text-white">

<div class="bg-slate-800 rounded-3xl p-8 w-[420px]">

<h1 class="text-3xl font-bold text-center mb-8">
Painel do Placar
</h1>

<div class="space-y-6">

<div>
<label class="block mb-2 font-bold">
🇳🇴 Noruega
</label>

<input
id="noruega"
type="number"
value="0"
class="w-full rounded p-3 text-black">
</div>

<div>
<label class="block mb-2 font-bold">
🏴 Inglaterra
</label>

<input
id="inglaterra"
type="number"
value="0"
class="w-full rounded p-3 text-black">
</div>

<button
onclick="salvar()"
class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-bold">
Salvar Placar
</button>

</div>

</div>

<script>

const SEC="sec_123456789";

async function salvar(){

    const noruega=Number(document.getElementById("noruega").value);

    const inglaterra=Number(document.getElementById("inglaterra").value);

    await fetch(`https://cbbase.qzz.io/projeto/${SEC}`,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify([
            {
                noruega,
                inglaterra,
                data:Date.now()
            }
        ])

    });

    alert("Placar atualizado!");

}

</script>

</body>
</html>
